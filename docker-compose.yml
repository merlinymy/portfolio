# The chat backend's services in Docker on the Mac (plan §3.2). For now only Postgres, which holds
# the search passages (phase 4); the api joins it in phase 5. The model server runs outside Docker
# (services/models), because containers on a Mac can't use the graphics chip.
#
#   docker compose up -d      start it (and again after each restart of the Mac)
#   docker compose down       stop it; the data stays in the postgres volume
#
# The password comes from .env (copy .env.example and fill it in; git ignores .env).
services:
  postgres:
    # Postgres 18 with pgvector 0.8.7, the add-on that stores embeddings and finds the closest.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # This Mac only: nothing on the network can reach the database.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
