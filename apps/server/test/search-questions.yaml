# The search test (npm run test:search; docs/phase-4-knowledge-plan.md). Each question passes when
# one of its expected passages comes back among the 6 the chat would be given. A passage is named
# by its file in content/ and a few words it contains, so reordering bullets doesn't break the test.
#
# Drafted 2026-10-21 from content/, for your review: edit, add or remove freely. Questions your
# fixed answers cover (salary, why you're looking...) aren't here, since those skip the search.

# Exact tool names: the keyword half of the search has to find these.
- question: Have you used Qdrant?
  expect:
    - { source: skills.yaml, contains: Qdrant }
    - { source: projects/arc.md, contains: Qdrant }
    - { source: projects/ornl-capstone.md, contains: Qdrant }
- question: Do you know Angular?
  expect:
    - { source: experience/siriusmindshare.md, contains: Angular }
    - { source: skills.yaml, contains: Angular }
- question: What's your experience with Docker?
  expect:
    - { source: experience/siriusmindshare.md, contains: Docker }
    - { source: skills.yaml, contains: Docker }
- question: Have you deployed anything to AWS?
  expect:
    - { source: experience/siriusmindshare.md, contains: AWS EC2 }
    - { source: skills.yaml, contains: AWS EC2 }
- question: Have you worked with Supabase?
  expect:
    - { source: experience/fantastbiotech.md, contains: Supabase }
    - { source: skills.yaml, contains: Supabase }
- question: Have you used Socket.IO or built anything real-time?
  expect:
    - { source: projects/fireproofsheep.md, contains: Socket.IO }
- question: Do you know Three.js?
  expect:
    - { source: earlier-projects.yaml, contains: Three.js }
- question: Have you worked on protein design or machine learning for biology?
  expect:
    - { source: projects/peptide-design.md, contains: RFdiffusion }
    - { source: skills.yaml, contains: RFdiffusion }

