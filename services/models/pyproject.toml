# The voice models that run natively on the Mac (plan §3.2, §6): text-to-speech in your cloned
# voice (Pocket-TTS, on the CPU through PyTorch) and the forced aligner (mlx-audio, on the graphics
# chip). mlx-audio also runs Parakeet speech-to-text, used only by the bake-off's checks.
[project]
name = "portfolio-models"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Pinned a week or more behind the newest release, so a bad release has time to be caught.
  "mlx-audio[tts,stt]==0.5.9",
  "pocket-tts==3.3.0",
  "fastapi>=0.156",
  "uvicorn>=0.54",
  "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]  # httpx: for FastAPI's test client

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
